---
  name: Labeler

  on:
    pull_request_target:
      branches:
        - main

  permissions: {}

  # No secrets or checkout, so no environment gate: all PRs get labeled
  # automatically. No untrusted code runs here.
  jobs:
    label:
      runs-on: ubuntu-latest
      permissions:
        contents: read
        pull-requests: write
      steps:
        - uses: actions/labeler@v6
          with:
            repo-token: "${{ github.token }}"
