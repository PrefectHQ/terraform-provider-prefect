# Terraform Provider release workflow.
name: Release to Registry

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  goreleaser:
    permissions:
      # GitHub considers creating releases and uploading assets as writing contents.
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # This action installs go and caches downloaded modules, so we favor
      # this over using the `mise-action` to install Go.
      - name: Set up Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_KEYRING_BASE64 }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Install GoReleaser
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: goreleaser
      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
